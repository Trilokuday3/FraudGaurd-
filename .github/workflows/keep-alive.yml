name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed API health endpoint
        run: |
          if [ -z "${{ vars.DEPLOYED_API_URL }}" ]; then
            echo "DEPLOYED_API_URL repository variable not set yet -- skipping until deploy is live."
            exit 0
          fi
          curl -fsS "${{ vars.DEPLOYED_API_URL }}/health"
