name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ./deploy/model_store
      MLFLOW_RUN_ID: 17d00e31654c4b9e8a9aa389f797d650
      DECISION_DB_URL: sqlite:///./decisions.db
      THRESHOLDS_PATH: ./decision/thresholds.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit tests/features tests/dq tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build
