name: Live streaming pipeline

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Two overlapping runs would both restore the same checkpoint and re-process
# the same offsets.
concurrency:
  group: live-streaming
  cancel-in-progress: false

jobs:
  produce-and-consume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAVE_SECRETS: ${{ secrets.DEPLOYED_DECISION_DB_URL != '' && secrets.KAFKA_BOOTSTRAP_SERVERS != '' && secrets.KAFKA_CA_CERT != '' && secrets.KAFKA_SERVICE_CERT != '' && secrets.KAFKA_SERVICE_KEY != '' }}
      MLFLOW_TRACKING_URI: ./deploy/model_store
      MLFLOW_RUN_ID: 17d00e31654c4b9e8a9aa389f797d650
      THRESHOLDS_PATH: ./decision/thresholds.json
      KAFKA_TOPIC: fraudguard.transactions
    steps:
      - name: Note skipped run when secrets are missing
        if: env.HAVE_SECRETS != 'true'
        run: echo "Streaming secrets not configured yet -- skipping until infra/kafka-aiven-setup.md is complete."

      - uses: actions/checkout@v4
        if: env.HAVE_SECRETS == 'true'

      - uses: actions/setup-python@v5
        if: env.HAVE_SECRETS == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            streaming/requirements.txt

      - uses: actions/setup-java@v4
        if: env.HAVE_SECRETS == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        if: env.HAVE_SECRETS == 'true'
        run: pip install -r requirements-dev.txt -r streaming/requirements.txt

      - name: Run producer
        if: env.HAVE_SECRETS == 'true'
        env:
          DECISION_DB_URL: ${{ secrets.DEPLOYED_DECISION_DB_URL }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_CA_CERT: ${{ secrets.KAFKA_CA_CERT }}
          KAFKA_SERVICE_CERT: ${{ secrets.KAFKA_SERVICE_CERT }}
          KAFKA_SERVICE_KEY: ${{ secrets.KAFKA_SERVICE_KEY }}
        run: python -m streaming.producer

      # The Spark checkpoint (consumed offsets) lives in the Actions cache.
      # A unique key per run means each successful run saves a fresh copy,
      # and restore-keys picks up the newest one next time. The save step is
      # skipped when the job fails, so a failed run never overwrites good
      # offsets. If the cache is ever evicted, the consumer restarts from
      # the topic's earliest retained offset: some recent demo rows are
      # scored twice, which is harmless for this dataset.
      - name: Restore Spark checkpoint
        if: env.HAVE_SECRETS == 'true'
        uses: actions/cache@v4
        with:
          path: ./spark-checkpoint
          key: spark-checkpoint-${{ github.run_id }}
          restore-keys: spark-checkpoint-

      - name: Run Spark consumer
        if: env.HAVE_SECRETS == 'true'
        env:
          DECISION_DB_URL: ${{ secrets.DEPLOYED_DECISION_DB_URL }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_CA_CERT: ${{ secrets.KAFKA_CA_CERT }}
          KAFKA_SERVICE_CERT: ${{ secrets.KAFKA_SERVICE_CERT }}
          KAFKA_SERVICE_KEY: ${{ secrets.KAFKA_SERVICE_KEY }}
          SPARK_CHECKPOINT_DIR: ./spark-checkpoint
        run: python -m streaming.spark_consumer
