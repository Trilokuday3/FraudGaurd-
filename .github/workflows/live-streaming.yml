name: Live streaming pipeline

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Two overlapping runs would corrupt the rsynced Spark checkpoint.
concurrency:
  group: live-streaming
  cancel-in-progress: false

jobs:
  produce-and-consume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAVE_SECRETS: ${{ secrets.DEPLOYED_DECISION_DB_URL != '' && secrets.KAFKA_BOOTSTRAP_SERVERS != '' && secrets.KAFKA_SASL_USERNAME != '' && secrets.KAFKA_SASL_PASSWORD != '' && secrets.VM_HOST != '' && secrets.VM_SSH_PRIVATE_KEY != '' }}
      MLFLOW_TRACKING_URI: ./deploy/model_store
      MLFLOW_RUN_ID: 17d00e31654c4b9e8a9aa389f797d650
      THRESHOLDS_PATH: ./decision/thresholds.json
      KAFKA_TOPIC: fraudguard.transactions
    steps:
      - name: Note skipped run when secrets are missing
        if: env.HAVE_SECRETS != 'true'
        run: echo "Streaming secrets not configured yet -- skipping until infra/kafka-vm-setup.md is complete."

      - uses: actions/checkout@v4
        if: env.HAVE_SECRETS == 'true'

      - uses: actions/setup-python@v5
        if: env.HAVE_SECRETS == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            streaming/requirements.txt

      - uses: actions/setup-java@v4
        if: env.HAVE_SECRETS == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        if: env.HAVE_SECRETS == 'true'
        run: pip install -r requirements-dev.txt -r streaming/requirements.txt

      - name: Run producer
        if: env.HAVE_SECRETS == 'true'
        env:
          DECISION_DB_URL: ${{ secrets.DEPLOYED_DECISION_DB_URL }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
        run: python -m streaming.producer

      - name: Fetch Spark checkpoint from the VM
        id: fetch_checkpoint
        if: env.HAVE_SECRETS == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          mkdir -p ./spark-checkpoint
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            "deploy@$VM_HOST:/opt/fraudguard/spark-checkpoint/" \
            ./spark-checkpoint/

      - name: Run Spark consumer
        if: env.HAVE_SECRETS == 'true'
        env:
          DECISION_DB_URL: ${{ secrets.DEPLOYED_DECISION_DB_URL }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          SPARK_CHECKPOINT_DIR: ./spark-checkpoint
        run: python -m streaming.spark_consumer

      # Only push if the fetch succeeded: pushing a fresh/partial local
      # checkpoint over the VM's real one would lose the stored offsets.
      - name: Push updated Spark checkpoint back to the VM
        if: ${{ always() && env.HAVE_SECRETS == 'true' && steps.fetch_checkpoint.outcome == 'success' }}
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./spark-checkpoint/ \
            "deploy@$VM_HOST:/opt/fraudguard/spark-checkpoint/"
