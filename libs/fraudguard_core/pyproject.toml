[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard-core"
version = "0.1.0"
description = "Shared schemas, config, and value sets for the FraudGuard platform."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "pandera>=0.18",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
