# streaming/docker-compose.kafka.yml
#
# WARNING: this file could not be started or tested when it was written
# (no Docker/VM was available). It must be verified by working through the
# verification checklist in infra/kafka-vm-setup.md before being relied on.
#
# Single-node Kafka (KRaft mode, no Zookeeper) for the VM hosting the
# live streaming pipeline's broker. This broker listens with
# SASL_PLAINTEXT: authenticated but not encrypted. Put a TLS terminator
# (e.g. a Caddy/nginx reverse proxy, or your VM host's own load balancer)
# in front of the exposed port before treating this as production-grade --
# documented as a follow-up in infra/kafka-vm-setup.md, not solved here.
#
# Env var naming rule in the apache/kafka image: KAFKA_* variables become
# properties by mapping "_" -> ".", "__" -> "-", "___" -> "_". Listener
# names containing an underscore (SASL_PLAINTEXT) therefore need three
# underscores in the variable name (SASL___PLAINTEXT) to produce
# "listener.name.sasl_plaintext.plain.sasl.jaas.config".
#
# The exported VM_PUBLIC_HOST, KAFKA_SASL_USERNAME and KAFKA_SASL_PASSWORD
# must be set in the shell for every docker compose command (compose
# re-interpolates this file each time); missing values fail fast.
services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://${VM_PUBLIC_HOST:?set VM_PUBLIC_HOST}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENER_NAME_SASL___PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:?set KAFKA_SASL_USERNAME}"
        password="${KAFKA_SASL_PASSWORD:?set KAFKA_SASL_PASSWORD}"
        user_${KAFKA_SASL_USERNAME:?set KAFKA_SASL_USERNAME}="${KAFKA_SASL_PASSWORD:?set KAFKA_SASL_PASSWORD}";
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
