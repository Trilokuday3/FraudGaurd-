# streaming/docker-compose.kafka.yml
#
# WARNING: this file could not be started or tested when it was written
# (no Docker/VM was available). It must be verified by working through the
# verification checklist in infra/kafka-vm-setup.md before being relied on.
#
# Single-node Kafka (KRaft mode, no Zookeeper) for the VM hosting the
# live streaming pipeline's broker. This broker listens with
# SASL_PLAINTEXT: authenticated but not encrypted. Put a TLS terminator
# (e.g. a Caddy/nginx reverse proxy, or your VM host's own load balancer)
# in front of the exposed port before treating this as production-grade --
# documented as a follow-up in infra/kafka-vm-setup.md, not solved here.
#
# SASL credentials: the broker reads them from a static JAAS file,
# ./kafka_server_jaas.conf next to this compose file, mounted read-only.
# That file is generated on the VM (infra/kafka-vm-setup.md step 4),
# chmod 600, and NEVER committed (it is in .gitignore). Using a JAAS file
# avoids depending on how the image maps KAFKA_* env var names containing
# underscores (the SASL_PLAINTEXT listener name) onto properties, which
# couldn't be verified here. This file therefore no longer interpolates
# the SASL credentials; only VM_PUBLIC_HOST must be exported for every
# docker compose command (a missing value fails fast).
services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://${VM_PUBLIC_HOST:?set VM_PUBLIC_HOST}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Keep broker data on the named volume below (the image's default
      # log dir is elsewhere, which would lose data on container re-create).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Small fixed heap so the broker fits on a 1 GB VM.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/etc/kafka/secrets/kafka_server_jaas.conf:ro

volumes:
  kafka-data:
